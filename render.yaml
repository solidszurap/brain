# Render Blueprint: Ember's server in Frankfurt. Secrets are set in Render's dashboard
# (sync: false), never in this file.
services:
  - type: web
    name: ember
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server
    healthCheckPath: /config
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EMBER_VOICE
        value: anthropic
      - key: EMBER_DAILY_CAP
        value: "150"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EMBER_ALLOWED_EMAILS
        sync: false
      - key: EMBER_FREE_PER_DAY
        value: "10"
      - key: EMBER_PLUS_EMAILS         # Plus for free: Gmails, comma-separated, or * for everyone
        sync: false
      - key: EMBER_UNLOCK_EMAILS       # testers: every look unlocked, XP unchanged
        sync: false
      - key: EMBER_OWNER_EMAILS        # who can open the owner page (Ember tab → Who uses Ember): your Gmail
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_YEARLY       # the yearly Ember Plus price
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMBER_TERMS_URL           # your ÁSZF page; with a live Stripe key, Plus is only sold once it's set
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
