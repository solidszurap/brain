# Render Blueprint: Ember's server in Frankfurt. Secrets are set in Render's dashboard
# (sync: false), never in this file.
services:
  - type: web
    name: ember
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server
    healthCheckPath: /config
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EMBER_VOICE
        value: anthropic
      - key: EMBER_DAILY_CAP
        value: "150"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: EMBER_ALLOWED_EMAILS
        sync: false
      - key: EMBER_FREE_PER_DAY
        value: "5"
      - key: EMBER_PRICE_LABEL
        value: "€4.99 / month"
      - key: EMBER_PLUS_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
