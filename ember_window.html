<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<style>
:root {
  --bg: #17130f; --panel: #211b16; --line: #3a3029; --text: #f1e7dc; --dim: #a8988a; --faint: #6f6156;
  --ember: #ff9a4d; --ember2: #ffcf8a; --you: #2c2520; --accent: #ffb36b; --danger: #e5776b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
header .name { font-weight: 650; letter-spacing: .02em; }
header nav { display: flex; gap: 4px; }
header nav button { background: none; border: 0; color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
header nav button.on { color: var(--text); background: var(--panel); }
header .mind { margin-left: auto; color: var(--faint); font-size: 13px; }
main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.on { display: flex; }

/* the face */
#home { gap: 0; }
.facecol { flex: 1.1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
#face { width: min(100%, 460px); aspect-ratio: 1; cursor: pointer; touch-action: manipulation; }
.whybtn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; margin-top: 6px; }
#why { display: none; margin-top: 12px; width: min(100%, 460px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--dim); }
#why.on { display: block; }
#why ul { margin: 6px 0 10px; padding-left: 18px; }
.meter { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; gap: 8px; margin: 4px 0; }
.meter i { display: block; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }

/* the chat */
.chatcol { flex: 1; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
#talk { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
.msg.ember { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.you { background: var(--you); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg .t { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.day { align-self: center; font-size: 12px; color: var(--faint); margin: 6px 0; }
.empty { color: var(--faint); margin: auto; text-align: center; max-width: 280px; }
#thinking { color: var(--dim); font-size: 13px; padding: 0 20px 6px; min-height: 22px; }
form { display: flex; gap: 8px; padding: 12px 16px 6px; }
#text { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; min-height: 44px; max-height: 160px; }
#text:focus { outline: none; border-color: var(--accent); }
form button { background: var(--accent); color: #2a1a0c; border: 0; border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
.note { font-size: 12px; color: var(--faint); padding: 0 16px 12px; }
.problem { color: var(--danger); }

/* memory page */
#memory { overflow-y: auto; justify-content: center; }
.mem { width: min(100%, 760px); padding: 24px 20px 40px; }
.mem h1 { font-size: 22px; margin: 0 0 4px; }
.mem .sub { color: var(--dim); margin: 0 0 22px; }
.mem h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 24px 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
.card .body { flex: 1; min-width: 0; }
.card .src { font-size: 13px; color: var(--dim); margin-top: 3px; }
.card .src q { font-style: italic; }
.card button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.card button.forget:hover { color: var(--danger); border-color: var(--danger); }
.card input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; font: inherit; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  #home { flex-direction: column; }
  .facecol { flex: none; padding: 8px 16px; }
  #face { width: min(60vw, 30vh, 260px); }
  #why { max-height: 26vh; overflow-y: auto; }
  .chatcol { flex: 1; min-height: 0; border-left: 0; border-top: 1px solid var(--line); }
  header { padding: 10px 16px; gap: 10px; }
  header .mind { display: none; }
}
</style>
</head>
<body>
<header>
  <span class="name">Ember</span>
  <nav>
    <button data-view="home" class="on">Ember</button>
    <button data-view="memory">What Ember knows about me</button>
  </nav>
  <span class="mind" id="mind"></span>
</header>
<main>
  <section class="view on" id="home">
    <div class="facecol">
      <canvas id="face" title="Poke Ember"></canvas>
      <button class="whybtn" id="whybtn">Why this face?</button>
      <div id="why"></div>
    </div>
    <div class="chatcol">
      <div id="talk"></div>
      <div id="thinking"></div>
      <form id="form">
        <textarea id="text" rows="1" placeholder="Say something to Ember…" maxlength="2000"></textarea>
        <button type="submit">Send</button>
      </form>
      <div class="note" id="note">Ember lives on this computer. To think, it sends your conversation and what it remembers to its mind (the LLM set in .env).</div>
    </div>
  </section>
  <section class="view" id="memory"><div class="mem" id="memlist"></div></section>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const post = (path, data) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Ember": "1"},
  body: JSON.stringify(data || {})}).then(r => r.ok ? r.json() : null).catch(() => null);
let S = null, lastTalkKey = "", offline = false;

// ------------------------------------------------------------------ polling
async function poll() {
  try {
    const r = await fetch("/state?v=" + (document.hidden ? 0 : 1), {cache: "no-store"});
    S = await r.json();
    offline = false;
    render();
  } catch (e) {
    offline = true;
    $("#thinking").textContent = "Ember's program isn't running. Start it with start_ember.bat.";
  }
}
setInterval(poll, 500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();

function fmtTime(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
function fmtDay(t) { return new Date(t * 1000).toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"}); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

function render() {
  $("#mind").textContent = "mind: " + S.mind;
  $("#thinking").textContent = S.thinking ? "Ember is thinking…" : "";
  $("#note").innerHTML = S.problem
    ? `<span class="problem">Its mind had a problem: ${esc(S.problem)}. The simple template mind answered instead.</span>`
    : "Ember lives on this computer. To think, it sends your conversation and what it remembers to its mind (the LLM set in .env).";
  const key = S.talk.length + ":" + (S.talk.length ? S.talk[S.talk.length - 1].t : 0);
  if (key !== lastTalkKey) { lastTalkKey = key; renderTalk(); }
  if ($("#why").classList.contains("on")) renderWhy();
}

function renderTalk() {
  const box = $("#talk");
  if (!S.talk.length) {
    box.innerHTML = `<div class="empty">Ember hasn't said anything yet. It will greet you in a moment.</div>`;
    return;
  }
  let html = "", day = "";
  for (const l of S.talk) {
    const d = fmtDay(l.t);
    if (d !== day) { day = d; html += `<div class="day">${esc(d)}</div>`; }
    html += `<div class="msg ${l.who}">${esc(l.text)}<span class="t">${fmtTime(l.t)}</span></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function renderWhy() {
  const f = S.face, m = (name, v) =>
    `<div class="meter"><span>${name}</span><i><b style="width:${Math.round(v * 100)}%"></b></i><span>${v.toFixed(2)}</span></div>`;
  $("#why").innerHTML = `<b>${esc(f.expression)}</b>, because:<ul>${f.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`
    + m("connection", S.connection) + m("curiosity", S.curiosity) + m("mood", S.mood)
    + `<div style="margin-top:8px">These are numbers in Ember's program, moved by real events and real time. They are not feelings, and nothing shows Ember feels anything.</div>`;
}
$("#whybtn").onclick = () => { $("#why").classList.toggle("on"); if (S) renderWhy(); };

// ------------------------------------------------------------------ talking
const ta = $("#text");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; });
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").onsubmit = async e => {
  e.preventDefault();
  const text = ta.value.trim();
  if (!text || offline) return;
  ta.value = ""; ta.style.height = "auto";
  await post("/talk", {text});
  poll();
};

// ------------------------------------------------------------------ views
document.querySelectorAll("header nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("header nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === b.dataset.view));
  if (b.dataset.view === "memory") loadMemory();
});

async function loadMemory() {
  const r = await fetch("/memory", {cache: "no-store"}).catch(() => null);
  if (!r) return;
  const M = await r.json();
  let html = `<h1>What Ember knows about me</h1><p class="sub">Everything Ember remembers about you, with your own words it came from. Correct anything that's wrong, or make it forget.</p>`;
  if (!M.count) html += `<p class="sub">Nothing yet. Talk with it, and what you tell it about yourself shows up here.</p>`;
  for (const [kind, items] of Object.entries(M.groups)) {
    if (!items.length) continue;
    html += `<h2>${esc(M.labels[kind] || kind)}</h2>`;
    for (const m of items) {
      const d = new Date(m.t * 1000).toLocaleDateString([], {day: "numeric", month: "short", year: "numeric"});
      html += `<div class="card" data-id="${esc(m.id)}"><div class="body"><div class="noteText">${esc(m.note)}</div>
        <div class="src">you said: <q>${esc(m.quote)}</q> · ${d}${m.edited ? " · corrected by you" : ""}</div></div>
        <button class="edit">Correct</button><button class="forget">Forget</button></div>`;
    }
  }
  $("#memlist").innerHTML = html;
}
$("#memlist").addEventListener("click", async e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const id = card.dataset.id;
  if (e.target.classList.contains("forget")) {
    if (confirm("Make Ember forget this? It can't be undone.")) { await post("/memory/forget", {id}); loadMemory(); }
  } else if (e.target.classList.contains("edit")) {
    const t = card.querySelector(".noteText");
    if (t.querySelector("input")) return;
    const old = t.textContent;
    t.innerHTML = `<input value="${esc(old)}" maxlength="200">`;
    const inp = t.querySelector("input");
    inp.focus();
    const done = async ok => { if (ok && inp.value.trim() && inp.value.trim() !== old) await post("/memory/edit", {id, note: inp.value.trim()}); loadMemory(); };
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") done(true); if (ev.key === "Escape") done(false); });
    inp.addEventListener("blur", () => done(true));
  }
});

// ------------------------------------------------------------------ the face
const cv = $("#face"), cx = cv.getContext("2d");
const EXPR = {      // mouth curve, mouth open, eye open, brow tilt, brow lift, pupil size, bounce, lift
  calm:      {m: .18, o: 0,   e: 1,    bt: 0,    bl: 0,    p: 1,    b: .4, y: 0},
  happy:     {m: .65, o: .15, e: .72,  bt: 0,    bl: .15,  p: 1.05, b: 1,  y: -.02},
  curious:   {m: .1,  o: .22, e: 1.08, bt: .35,  bl: .3,   p: 1.2,  b: .6, y: -.01},
  surprised: {m: 0,   o: .55, e: 1.25, bt: 0,    bl: .6,   p: .8,   b: .8, y: -.03},
  droopy:    {m: -.3, o: 0,   e: .62,  bt: -.4,  bl: -.1,  p: 1,    b: .15, y: .04},
  eager:     {m: .5,  o: .25, e: 1.12, bt: 0,    bl: .35,  p: 1.15, b: 1.4, y: -.03},
  amused:    {m: .55, o: .08, e: .8,   bt: .2,   bl: .1,   p: 1,    b: .8, y: -.01},
  focused:   {m: 0,   o: 0,   e: .78,  bt: .3,   bl: -.2,  p: .95,  b: .2, y: 0},
  thinking:  {m: -.05,o: 0,   e: .92,  bt: .25,  bl: .15,  p: 1,    b: .3, y: 0},
};
let cur = {...EXPR.calm}, glow = .5, mouse = {x: 0, y: 0, at: 0}, blinkAt = performance.now() + 2500, wiggleT = 0;
window.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  mouse = {x: (e.clientX - (r.left + r.width / 2)) / r.width, y: (e.clientY - (r.top + r.height / 2)) / r.height, at: performance.now()};
});
cv.addEventListener("click", () => { post("/poke"); wiggleT = performance.now(); });

function size() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
}
function lerp(a, b, k) { return a + (b - a) * k; }

function draw(now) {
  size();
  const W = cv.width, H = cv.height, u = W / 100;
  const f = S ? S.face : {expression: "calm", glow: .5, gaze: "away", wiggle: false};
  const target = EXPR[f.expression] || EXPR.calm;
  for (const k in cur) cur[k] = lerp(cur[k], target[k], .08);
  glow = lerp(glow, offline ? .15 : f.glow, .05);
  cx.clearRect(0, 0, W, H);

  const t = now / 1000;
  const breathe = Math.sin(t * 1.6) * .012 * (1 + cur.b * .4);
  const hop = Math.max(0, Math.sin(t * (2.2 + cur.b * 1.5))) * .018 * cur.b;
  const wig = (now - wiggleT < 900 || f.wiggle) ? Math.sin((now - wiggleT) / 40) * .04 * Math.max(0, 1 - (now - wiggleT) / 900) : 0;
  const tilt = (f.expression === "curious" ? .08 : 0) + wig;
  const bx = 50 * u, by = (56 + (cur.y - hop) * 100) * u;
  const rw = 31 * u * (1 + breathe), rh = 29 * u * (1 - breathe);

  // glow
  const g = cx.createRadialGradient(bx, by, rw * .3, bx, by, Math.min(rw * 1.6, 44 * u));
  g.addColorStop(0, `rgba(255,154,77,${.18 + glow * .35})`);
  g.addColorStop(1, "rgba(255,154,77,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  cx.save();
  cx.translate(bx, by); cx.rotate(tilt);
  // body: a soft drop of light
  const bodyG = cx.createRadialGradient(-rw * .3, -rh * .45, rw * .1, 0, 0, rw * 1.15);
  bodyG.addColorStop(0, `hsl(36, 100%, ${70 + glow * 12}%)`);
  bodyG.addColorStop(.55, `hsl(${22 + glow * 8}, 95%, ${52 + glow * 10}%)`);
  bodyG.addColorStop(1, `hsl(14, 80%, ${30 + glow * 10}%)`);
  cx.fillStyle = bodyG;
  cx.beginPath();
  cx.moveTo(0, -rh * 1.25);
  cx.bezierCurveTo(rw * .55, -rh * 1.05, rw * 1.05, -rh * .35, rw, rh * .2);
  cx.bezierCurveTo(rw * .95, rh * .85, rw * .5, rh, 0, rh);
  cx.bezierCurveTo(-rw * .5, rh, -rw * .95, rh * .85, -rw, rh * .2);
  cx.bezierCurveTo(-rw * 1.05, -rh * .35, -rw * .55, -rh * 1.05, 0, -rh * 1.25);
  cx.fill();

  // eyes
  let blink = 1;
  if (now > blinkAt) { const k = (now - blinkAt) / 160; blink = k < 1 ? Math.abs(1 - 2 * k) : 1; if (k >= 1) blinkAt = now + 2500 + Math.random() * 4000; }
  let gx = 0, gy = 0;
  if (f.expression === "thinking") { gx = .5; gy = -.6; }
  else if (f.gaze === "you" && now - mouse.at < 4000) { gx = Math.max(-1, Math.min(1, mouse.x * 2.2)); gy = Math.max(-1, Math.min(1, mouse.y * 2.2)); }
  else if (f.gaze === "you") { gx = 0; gy = .1; }
  else { gx = Math.sin(t * .3) * .6; gy = .3; }
  const ex = 11 * u, ey = -3 * u, er = 6.2 * u;
  for (const s of [-1, 1]) {
    const open = Math.max(.05, cur.e * blink);
    cx.save(); cx.translate(s * ex, ey);
    cx.fillStyle = "#2b1407";
    cx.beginPath(); cx.ellipse(0, 0, er * .82, er * open, 0, 0, Math.PI * 2); cx.fill();
    // pupil light
    cx.save(); cx.beginPath(); cx.ellipse(0, 0, er * .82, er * open, 0, 0, Math.PI * 2); cx.clip();
    cx.fillStyle = "#fff3dd";
    cx.beginPath(); cx.arc(gx * er * .35 - er * .18, gy * er * .3 - er * .25, er * .26 * cur.p, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.arc(gx * er * .35 + er * .15, gy * er * .3 + er * .12, er * .1 * cur.p, 0, Math.PI * 2); cx.fill();
    cx.restore();
    // happy eyes: a lower lid curve
    if (cur.m > .4 && cur.e < .85) {
      cx.fillStyle = bodyG; cx.beginPath(); cx.ellipse(0, er * open * 1.05, er * 1.0, er * .55, 0, 0, Math.PI * 2); cx.fill();
    }
    // brows
    cx.strokeStyle = "rgba(60,25,8,.75)"; cx.lineWidth = 1.6 * u; cx.lineCap = "round";
    const byy = -er * (1.55 + cur.bl * .6) - (1 - cur.e) * er * .4;
    cx.beginPath();
    const inner = s > 0 ? -er * .8 : er * .8, outer = -inner;
    cx.moveTo(inner, byy + cur.bt * er * .45);
    cx.quadraticCurveTo(0, byy - er * .25, outer, byy - cur.bt * er * .1);
    cx.stroke();
    cx.restore();
  }
  // mouth
  const mw = 9 * u, my = 9 * u;
  cx.strokeStyle = "#3a1608"; cx.lineWidth = 1.8 * u; cx.lineCap = "round";
  if (cur.o > .12) {
    cx.fillStyle = "#3a1608";
    cx.beginPath(); cx.ellipse(0, my + cur.m * 2 * u, mw * (.35 + cur.m * .4), mw * cur.o * .7, 0, 0, Math.PI * 2); cx.fill();
  } else {
    cx.beginPath();
    cx.moveTo(-mw * .6, my);
    cx.quadraticCurveTo(f.expression === "thinking" ? mw * .3 : 0, my + cur.m * 10 * u, mw * .6, my + (f.expression === "thinking" ? -u : 0));
    cx.stroke();
  }
  // cheeks
  cx.fillStyle = `rgba(255,110,90,${.12 + Math.max(0, cur.m) * .25})`;
  for (const s of [-1, 1]) { cx.beginPath(); cx.ellipse(s * 19 * u, 6 * u, 4.2 * u, 2.6 * u, 0, 0, Math.PI * 2); cx.fill(); }
  cx.restore();

  // shadow
  cx.fillStyle = "rgba(0,0,0,.28)";
  cx.beginPath(); cx.ellipse(bx, 90 * u, rw * (.8 - hop * 4), 3 * u, 0, 0, Math.PI * 2); cx.fill();

  // thinking dots
  if (f.expression === "thinking") {
    for (let i = 0; i < 3; i++) {
      cx.fillStyle = `rgba(255,207,138,${.3 + .7 * Math.max(0, Math.sin(t * 4 - i * .8))})`;
      cx.beginPath(); cx.arc(bx + rw * .9 + i * 4.5 * u, by - rh * 1.15 - i * 2.5 * u, (1.3 + i * .4) * u, 0, Math.PI * 2); cx.fill();
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
